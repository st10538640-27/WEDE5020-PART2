<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description"
          content="Contact Toyota Corolla Workshop.">

    <title>Contact | Toyota Corolla Workshop</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <div class="container nav-wrap">

            <a class="brand" href="home.html">
                <img src="IMAGES/logo.svg" alt="Workshop logo">
                <span>Toyota Corolla Workshop</span>
            </a>

            <nav aria-label="Main navigation">
                <ul class="nav-links">
                    <li><a href="home.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="services.html">Services</a></li>
                    <li><a href="gallery.html">Gallery</a></li>
                    <li><a class="active" href="contact.html">Contact</a></li>
                </ul>
            </nav>

        </div>
    </header>

    <main class="container section">

        <h1>Contact Us</h1>

        <div class="contact-grid">

            <section class="card">

                <h2>Contact Information</h2>

                <p>
                    <strong>Phone:</strong> 011 123 4567
                </p>

                <p>
                    <strong>Email:</strong> info@example.com
                </p>

                <p>
                    <strong>Location:</strong> South Africa
                </p>

                <p>
                    <strong>Hours:</strong> Monday–Friday, 08:00–17:00
                </p>

            </section>

            <section class="card">

                <h2>Send a Message</h2>

                <form action="#" method="post">

                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>

                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required>

                    <label for="message">Message</label>
                    <textarea id="message" name="message"
                              rows="6" required></textarea>

                    <button class="button" type="submit">
                        Submit
                    </button>

                </form>

            </section>

        </div>

    </main>

    <footer class="site-footer">
        &copy; 2026 ST10538640 - Toyota Corolla Workshop
    </footer>

</body>

</html>
